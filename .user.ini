; .user.ini
; Поднимает лимиты PHP на загрузку файлов — по умолчанию хостинг разрешает
; загружать только очень маленькие файлы (обычно 2 МБ), из-за чего видео
; для виджетов "не грузилось" без какой-либо понятной ошибки.
;
; Важно: на некоторых бесплатных хостингах (например, InfinityFree) эти
; значения могут быть дополнительно ограничены самим хостингом и .user.ini
; не всегда позволяет их превысить — тогда нужно писать в поддержку
; хостинга или заливать более лёгкие/сжатые видеофайлы.
;
; Файл подхватывается PHP автоматически (обычно в течение нескольких минут
; после загрузки на сервер), перезапускать ничего не нужно.

upload_max_filesize = 60M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
