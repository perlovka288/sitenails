name: Deploy to InfinityFree

on:
  push:
    branches:
      - main # Если твоя основная ветка называется master, замени на master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /nails.likesyou.org/htdocs/
        # ВАЖНО: эти пути НИКОГДА не перезаписываются деплоем. Если их не
        # исключить, каждый git push будет затирать на сервере живую базу
        # (текст "О мне", отзывы, записи, зарегистрированных клиентов) и
        # загруженные фото версией из репозитория — именно так пропадала
        # вся информация после пуша.
        exclude: |
          **/.git*
          **/.git*/**
          data/database.sqlite
          data/.htaccess
          assets/img/avatars/**
          assets/img/reviews/**
          assets/uploads/**